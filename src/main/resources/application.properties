# ==============================================================
# CONFIGURAÇÃO DO BANCO DE DADOS (POSTGRESQL)
# ==============================================================
spring.datasource.url=jdbc:postgresql://localhost:5432/imwitaimpaulista_db
spring.datasource.username=postgres
spring.datasource.password=1234
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# ==============================================================
# CONFIGURAÇÕES DO JWT (PARA O JWTTOKENPROVIDER)
# ==============================================================
# A chave abaixo resolve o erro "Could not resolve placeholder 'jwt.secret'"
jwt.secret=minha_chave_secreta_super_segura_para_a_igreja_itaim_paulista_2026_mais_segura_ainda_com_mais_caracteres
# Tempo de expiração (24 horas em milissegundos)
jwt.expiration=86400000

# ==============================================================
# CONFIGURAÇÃO DE UPLOAD E ARQUIVOS ESTÁTICOS
# ==============================================================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
# Local onde as fotos enviadas pelo painel serão guardadas
spring.web.resources.static-locations=file:uploads/
server.port=8080